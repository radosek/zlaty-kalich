[package]
name = "zlaty-kalich"
version = "0.1.0"
edition = "2024"
description = "Native cross-platform runner for the Czech adventure game Zlatý Kalich (2002)"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
ruffle_core = { git = "https://github.com/ruffle-rs/ruffle", rev = "387ea68a46891b28e1579bc53725263396b4be38", features = ["audio", "mp3", "nellymoser", "default_compatibility_rules", "default_font"] }
ruffle_render = { git = "https://github.com/ruffle-rs/ruffle", rev = "387ea68a46891b28e1579bc53725263396b4be38" }
ruffle_render_wgpu = { git = "https://github.com/ruffle-rs/ruffle", rev = "387ea68a46891b28e1579bc53725263396b4be38" }
ruffle_frontend_utils = { git = "https://github.com/ruffle-rs/ruffle", rev = "387ea68a46891b28e1579bc53725263396b4be38", default-features = false, features = ["cpal"] }
anyhow = "1"
async-channel = "2.5"
cpal = "0.16"
dirs = "6"
encoding_rs = "0.8"
rfd = "0.15"
swf = { path = "vendor/swf" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
rustysynth = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
winit = "0.30.13"
unrar-ng = "0.7"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.dev]
debug = "line-tables-only"

[patch."https://github.com/ruffle-rs/ruffle"]
swf = { path = "vendor/swf" }
