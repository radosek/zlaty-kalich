# Vendored from ruffle-rs/ruffle @ 387ea68 with one change: a settable code
# page for pre-SWF6 strings (see `set_legacy_encoding` in src/string.rs).
[package]
name = "swf"
version = "0.3.0"
description = "Read and write the Adobe Flash SWF file format."
authors = ["Ruffle LLC <ruffle@ruffle.rs>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
bitflags = "2.12.1"
bitstream-io = "4.10.0"
encoding_rs = "0.8.35"
num-derive = "0.4.2"
num-traits = "0.2.19"
log = "0.4"
flate2 = { version = "1.1.9", optional = true }
lzma-rs = { version = "0.3.0", optional = true }
enum-map = "2.7.3"
simple_asn1 = "0.6.4"

[features]
default = ["flate2", "lzma"]
lzma = ["lzma-rs"]
