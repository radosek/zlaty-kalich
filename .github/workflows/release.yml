name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-universal
          - os: windows-2022
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Ruffle's AVM2 globals are compiled with Java at build time.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libgtk-3-dev libfuse2

      - name: Test
        run: cargo test

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/zlaty-kalich.exe dist/ZlatyKalich-native.exe
          cp README.md assets/GeneralUser-GS-LICENSE.txt dist/
          cd dist && 7z a ../zlaty-kalich-windows-x64.zip .

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zlaty-kalich-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.AppImage
            zlaty-kalich-windows-x64.zip


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
