name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-universal
          - os: windows-2022
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Ruffle's AVM2 globals are compiled with Java at build time.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: Swatinem/rust-cache@v2

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libgtk-3-dev libfuse2

      - name: Test
        run: cargo test

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/zlaty-kalich.exe dist/ZlatyKalich-native.exe
          cp README.md assets/GeneralUser-GS-LICENSE.txt dist/
          cd dist && 7z a ../zlaty-kalich-windows-x64.zip .

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zlaty-kalich-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.AppImage
            zlaty-kalich-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.AppImage
            zlaty-kalich-windows-x64.zip
